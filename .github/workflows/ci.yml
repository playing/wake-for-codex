name: CI

on:
  push:
  pull_request:

jobs:
  portable-tests:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q launcher scripts
      - name: Run state and configuration tests
        run: python -m launcher.self_test
      - name: Validate phrase artifacts
        run: python -m launcher.sync_phrase_manifest
      - name: Validate macOS shell syntax
        if: runner.os == 'macOS'
        run: |
          /bin/sh -n run-wake-launcher.sh
          /bin/sh -n start-wake-launcher.sh
          /bin/sh -n stop-wake-launcher.sh
          /bin/sh -n scripts/install-macos.sh
          /bin/sh -n scripts/uninstall-hook.sh
      - name: Validate Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }
